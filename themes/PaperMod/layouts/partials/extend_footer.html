<script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>
<script>
	document.querySelectorAll('.pageclip-form').forEach(function (form) {
		new MutationObserver(function () {
			var success = form.querySelector('.pageclip-form__success');
			var message = form.querySelector('.pageclip-form__success__message');
			var submit = form.querySelector('.pageclip-form__submit');
			if (success) {
				if (submit && success !== submit.previousElementSibling) {
					form.insertBefore(success, submit);
				}
				success.onclick = null;
				if (submit && !submit.disabled) {
					submit.focus();
				}
			}
			if (message && success) {
				message.setAttribute('role', 'status');
				message.textContent = "Thanks for getting in touch. I'll get back to you soon.";
			}
		}).observe(form, { childList: true, attributes: true, attributeFilter: ['class', 'disabled'] });
	});
</script>
{{- /* Footer custom content area end */ -}}
